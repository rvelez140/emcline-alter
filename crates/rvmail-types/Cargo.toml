[package]
name = "rvmail-types"
description = "Tipos de la API de RV Mail compartidos por el servidor y los clientes (también WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Solo el servidor: lectura directa desde Postgres (no compila a WebAssembly)
sqlx = ["dep:sqlx"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "uuid", "chrono", "json", "derive"], optional = true }
uuid = { version = "1.28.0", default-features = false, features = ["serde", "std"] }

[dev-dependencies]
serde_json = "1.0.154"
