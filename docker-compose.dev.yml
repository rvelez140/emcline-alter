# Infraestructura de DESARROLLO: base de datos, Redis y un servidor de correo
# de pruebas (GreenMail) con cuentas que se crean solas.
#   make dev-up      → levanta todo esto
#   pnpm dev         → corre api, worker y web en tu máquina con recarga en caliente
#
# Cuentas de prueba (usuario = correo, contraseña = parte antes de @):
#   test1@rvmail.local / test1      test2@rvmail.local / test2
#   IMAP localhost:3143  SMTP localhost:3025  (sin TLS)
#   IMAPS localhost:3993 SMTPS localhost:3465 (certificado autofirmado)

name: rvmail-dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rvmail
      POSTGRES_PASSWORD: rvmail
      POSTGRES_DB: rvmail
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - dev_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rvmail"]
      interval: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20

  greenmail:
    image: greenmail/standalone:2.1.3
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all
        -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.auth.disabled=false
        -Dgreenmail.users=test1:test1@rvmail.local,test2:test2@rvmail.local
        -Dgreenmail.users.login=email
        -Dgreenmail.verbose
    ports:
      - "127.0.0.1:3025:3025" # SMTP
      - "127.0.0.1:3143:3143" # IMAP
      - "127.0.0.1:3465:3465" # SMTPS
      - "127.0.0.1:3993:3993" # IMAPS
      - "127.0.0.1:8080:8080" # API REST de GreenMail (inspección)

  # Adminer para inspeccionar la base de datos (opcional: --profile tools)
  adminer:
    image: adminer:4
    profiles: ["tools"]
    ports:
      - "127.0.0.1:8081:8080"

volumes:
  dev_postgres:
