[workspace]
resolver = "2"
members = ["crates/rvmail-types", "crates/rvmail-core", "crates/rvmail"]

[workspace.package]
version = "0.2.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[profile.release]
# Binario pequeño y rápido para VPS pequeños / ARM
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
