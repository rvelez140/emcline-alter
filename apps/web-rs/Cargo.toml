[workspace]
# Proyecto aparte: se compila a WebAssembly con trunk

[package]
name = "rvmail-web"
version = "0.2.0"
description = "Cliente web de RV Mail en Rust (Leptos, WebAssembly)"
edition = "2021"
publish = false

[dependencies]
ammonia = "4.2.3"
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde", "wasmbind", "clock"] }
console_error_panic_hook = "0.1.7"
gloo-net = { version = "0.7.0", default-features = false, features = ["http", "json"] }
leptos = { version = "0.8", features = ["csr"] }
rvmail-types = { version = "0.2.0", path = "../../crates/rvmail-types" }
send_wrapper = "0.6.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["serde"] }
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["EventSource", "EventTarget", "MessageEvent", "MediaQueryList", "Window"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
