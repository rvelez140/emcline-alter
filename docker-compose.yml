# RV Mail — despliegue de producción
#
#   Modo "caddy"    (VPS limpio):  docker compose --profile caddy up -d
#   Modo "external" (aaPanel/nginx ya usa 80/443): docker compose up -d
#     → la app queda en 127.0.0.1:${HTTP_PORT} y tu proxy apunta ahí.
#
# Una sola imagen `rvmail` (binario Rust, amd64/arm64): el servicio `app` sirve
# la API, el tiempo real, MCP y la web; `worker` sincroniza los buzones.
# Funciona igual con Podman (`podman compose`). Normalmente no se llama a mano:
# usa ./scripts/install.sh o `make up`.

name: rvmail

x-app-env: &app-env
  RVMAIL_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-rvmail}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rvmail}
  REDIS_URL: redis://:${REDIS_PASSWORD:?falta REDIS_PASSWORD}@redis:6379
  MASTER_KEY: ${MASTER_KEY:?falta MASTER_KEY}
  TZ: ${TZ:-America/Santo_Domingo}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: json
  IMAP_ALLOW_SELF_SIGNED: ${IMAP_ALLOW_SELF_SIGNED:-false}
  MAILSERVER_PROVIDER: ${MAILSERVER_PROVIDER:-none}
  MAILSERVER_HOSTNAME: ${MAILSERVER_HOSTNAME:-}
  MAILSERVER_IMAP_PORT: ${MAILSERVER_IMAP_PORT:-993}
  MAILSERVER_SMTP_PORT: ${MAILSERVER_SMTP_PORT:-465}

# El servidor de correo (Postfix/Dovecot de aaPanel) y el panel corren en el
# propio VPS: estos alias apuntan a la IP del host desde dentro de los contenedores.
# MAILSERVER_HOSTNAME se resuelve al host para que el certificado TLS coincida
# sin depender de que el router haga "hairpin NAT".
x-host-access: &host-access
  - "host.docker.internal:host-gateway"
  - "${MAILSERVER_HOSTNAME:-mail.invalid}:host-gateway"

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Contenedores endurecidos: sin privilegios extra, sistema de archivos de solo lectura
x-hardening: &hardening
  read_only: true
  tmpfs: ["/tmp"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

services:
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging: *logging

  app:
    image: ${IMAGE_PREFIX:-rvmail}:${APP_VERSION:-latest}
    build:
      context: .
      target: rvmail
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    command: ["api"]
    restart: unless-stopped
    <<: *hardening
    # En modo external solo escucha en localhost; el proxy del host publica el dominio
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:3000"
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      APP_URL: https://${DOMAIN}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
      AAPANEL_URL: ${AAPANEL_URL:-https://host.docker.internal:7800}
      AAPANEL_API_KEY: ${AAPANEL_API_KEY:-}
      AAPANEL_VERIFY_TLS: ${AAPANEL_VERIFY_TLS:-false}
      AGENT_SEND_LIMIT_PER_HOUR: ${AGENT_SEND_LIMIT_PER_HOUR:-30}
      STALWART_URL: ${STALWART_URL:-http://stalwart:8080}
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER:-}
      STALWART_ADMIN_PASSWORD: ${STALWART_ADMIN_PASSWORD:-}
      MAILSERVER_JMAP_URL: ${MAILSERVER_JMAP_URL:-}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_MICROSOFT_CLIENT_ID: ${SSO_MICROSOFT_CLIENT_ID:-}
      SSO_MICROSOFT_CLIENT_SECRET: ${SSO_MICROSOFT_CLIENT_SECRET:-}
      SSO_MICROSOFT_TENANT: ${SSO_MICROSOFT_TENANT:-common}
      SSO_YAHOO_CLIENT_ID: ${SSO_YAHOO_CLIENT_ID:-}
      SSO_YAHOO_CLIENT_SECRET: ${SSO_YAHOO_CLIENT_SECRET:-}
      SSO_AUTO_SIGNUP: ${SSO_AUTO_SIGNUP:-false}
    # Explícito (no solo en la imagen): Podman ignora el HEALTHCHECK de imágenes OCI
    healthcheck:
      test: ["CMD", "/usr/local/bin/rvmail", "healthcheck", "api"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    extra_hosts: *host-access
    networks:
      default:
        # IP fija: es la que se añade a la lista blanca de la API de aaPanel
        ipv4_address: ${API_IP:-172.30.57.10}
    mem_limit: ${APP_MEM_LIMIT:-256m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-rvmail}:${APP_VERSION:-latest}
    command: ["worker"]
    restart: unless-stopped
    <<: *hardening
    environment:
      <<: *app-env
      SYNC_DAYS: ${SYNC_DAYS:-90}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-300}
      WORKER_MAX_ACCOUNTS: ${WORKER_MAX_ACCOUNTS:-500}
      SSO_GOOGLE_CLIENT_ID: ${SSO_GOOGLE_CLIENT_ID:-}
      SSO_GOOGLE_CLIENT_SECRET: ${SSO_GOOGLE_CLIENT_SECRET:-}
      SSO_MICROSOFT_CLIENT_ID: ${SSO_MICROSOFT_CLIENT_ID:-}
      SSO_MICROSOFT_CLIENT_SECRET: ${SSO_MICROSOFT_CLIENT_SECRET:-}
      SSO_MICROSOFT_TENANT: ${SSO_MICROSOFT_TENANT:-common}
      SSO_YAHOO_CLIENT_ID: ${SSO_YAHOO_CLIENT_ID:-}
      SSO_YAHOO_CLIENT_SECRET: ${SSO_YAHOO_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "/usr/local/bin/rvmail", "healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    extra_hosts: *host-access
    mem_limit: ${WORKER_MEM_LIMIT:-256m}
    depends_on:
      app:
        condition: service_healthy # la API aplica las migraciones al arrancar
    logging: *logging

  # Servidor de correo Stalwart (opcional, perfil "stalwart"): SMTP, IMAP, JMAP,
  # CalDAV/CardDAV en Rust. RV Mail lo administra por JMAP (MAILSERVER_PROVIDER=stalwart).
  # `rvmail install` completa su configuración inicial sin pasar por su asistente web.
  stalwart:
    image: stalwartlabs/stalwart:${STALWART_VERSION:-latest}
    profiles: ["stalwart"]
    restart: unless-stopped
    ports:
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
      - "4190:4190"
      # Administración/JMAP solo local: RV Mail habla con él por la red interna
      - "127.0.0.1:${STALWART_HTTP_PORT:-8180}:8080"
    environment:
      # Administrador de recuperación: rvmail install lo usa para la configuración
      # inicial (x:Bootstrap) y guarda el administrador permanente en .env
      STALWART_RECOVERY_ADMIN: admin:${STALWART_RECOVERY_PASSWORD:-}
    volumes:
      - stalwart_data:/var/lib/stalwart
      - stalwart_etc:/etc/stalwart
    mem_limit: ${STALWART_MEM_LIMIT:-512m}
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rvmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rvmail}
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS:-128MB}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE:-384MB}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS:-50}
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=4
      - -c
      - hot_standby=on
      # Límite de WAL retenido para el respaldo: si está caído mucho tiempo, no llena el disco
      - -c
      - max_slot_wal_keep_size=${PG_MAX_SLOT_WAL:-2GB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    mem_limit: ${PG_MEM_LIMIT:-768m}
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-256mb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: ${REDIS_MEM_LIMIT:-320m}
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.30.57.0/24}

volumes:
  stalwart_data:
  stalwart_etc:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
