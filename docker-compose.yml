# RV Mail — despliegue de producción
#
#   Modo "caddy"    (VPS limpio):  docker compose --profile caddy up -d
#   Modo "external" (aaPanel/nginx ya usa 80/443): docker compose up -d
#     → la app queda en 127.0.0.1:${HTTP_PORT} y tu proxy apunta ahí.
#
# Normalmente no se llama a mano: usa ./scripts/install.sh o `make up`.

name: rvmail

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://${POSTGRES_USER:-rvmail}:${POSTGRES_PASSWORD:?falta POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-rvmail}
  REDIS_URL: redis://:${REDIS_PASSWORD:?falta REDIS_PASSWORD}@redis:6379
  MASTER_KEY: ${MASTER_KEY:?falta MASTER_KEY}
  TZ: ${TZ:-America/Santo_Domingo}
  IMAP_ALLOW_SELF_SIGNED: ${IMAP_ALLOW_SELF_SIGNED:-false}

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    profiles: ["caddy"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?falta DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  web:
    image: ${IMAGE_PREFIX:-rvmail}-web:${APP_VERSION:-latest}
    build:
      context: .
      target: web
    restart: unless-stopped
    # En modo external solo escucha en localhost; el proxy del host publica el dominio
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80"
    depends_on:
      api:
        condition: service_healthy
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-rvmail}-api:${APP_VERSION:-latest}
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      <<: *app-env
      JWT_SECRET: ${JWT_SECRET:?falta JWT_SECRET}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-false}
      APP_URL: https://${DOMAIN}
      SESSION_DAYS: ${SESSION_DAYS:-30}
      INSECURE_COOKIES: ${INSECURE_COOKIES:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  worker:
    image: ${IMAGE_PREFIX:-rvmail}-worker:${APP_VERSION:-latest}
    build:
      context: .
      target: worker
    restart: unless-stopped
    environment:
      <<: *app-env
      SYNC_DAYS: ${SYNC_DAYS:-90}
      SYNC_INTERVAL_SEC: ${SYNC_INTERVAL_SEC:-300}
      WORKER_MAX_ACCOUNTS: ${WORKER_MAX_ACCOUNTS:-500}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      api:
        condition: service_healthy # la API aplica las migraciones al arrancar
    logging: *logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-rvmail}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-rvmail}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
